<!doctype html>
<html>
  <head>
    <meta http-equiv="content-type" content="text/html; charset=UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link type="text/css" rel="stylesheet" href="player/ext/css/jquery.fancybox.min.css">
    <link type="text/css" rel="stylesheet" href="player/ext/css/snackbar.min.css">
    <link type="text/css" rel="stylesheet" href="player/player.css">

    <title>TrachymelaID - Interactive Key</title>

    <style>
      #site-nav {
        background-color: #4b3621;
        color: white;
        padding: 8px 16px;
        display: flex;
        align-items: center;
        gap: 16px;
        font-family: Arial, sans-serif;
        font-size: 14px;
        position: relative;
        z-index: 9999;
        flex-shrink: 0;
      }
      #site-nav a {
        color: #efe6d8;
        text-decoration: none;
        font-weight: bold;
      }
      #site-nav a:hover { color: white; }
      #site-nav .nav-title {
        font-size: 16px;
        font-weight: bold;
      }
      body {
        display: flex;
        flex-direction: column;
        height: 100vh;
        margin: 0;
        overflow: hidden;
      }
      #player-wrapper {
        flex: 1;
        overflow: hidden;
        position: relative;
      }
      /* Ensure the GWT player fills its container */
      #player-wrapper > div,
      #player-wrapper > table {
        width: 100% !important;
        height: 100% !important;
      }
    </style>
  </head>

  <body>

    <div id="site-nav">
      <a href="index.html">&#8592; Home</a>
      <span class="nav-title">TrachymelaID &mdash; Interactive Key</span>
    </div>

    <div id="player-wrapper">

    <noscript>
      <p>Your web browser must have JavaScript enabled in order for this application to display correctly.</p>
    </noscript>

    <div id="loader" class="loader-outer"><div class="loader-inner">
      <div class="loader-ring"></div>
    </div></div>
    
    <script type="text/javascript">
      var config = {
        entityThumbnails: "true",
        featureThumbnails: "true",
        replaceFind: "true",
      };
    </script>
    
    <script type="application/javascript" language="javascript" src="key\trachymela.json" ></script>  
    
    <script src="player/ext/js/base64.min.js"></script>
    <script src="player/ext/js/jquery-3.4.1.min.js"></script>
    <script src="player/ext/js/jquery.fancybox.min.js"></script>
    <script src="player/ext/js/lz-string.min.js"></script>
    <script src="player/ext/js/snackbar.min.js"></script>
    <script src="player/player.nocache.js"></script>

    </div><!-- end player-wrapper -->
  </body>
</html>
